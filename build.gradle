plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
}

group = 'com.facochico.edu'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.hibernate.orm:hibernate-core:7.4.17.Final'
    runtimeOnly 'org.postgresql:postgresql:42.7.15'

    def lombokCoordinates = 'org.projectlombok:lombok:1.18.48'
    compileOnly lombokCoordinates
    annotationProcessor lombokCoordinates
    testCompileOnly lombokCoordinates
    testAnnotationProcessor lombokCoordinates

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
